
name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: documentation-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11

      - name: Install MkDocs and dependencies
        run: |
          pip install -r requirements-docs.txt -r requirements-planner-tests.txt
          python -m playwright install --with-deps chromium

      - name: Validate the planner and strict documentation build
        run: |
          python scripts/planner/validate_catalog.py
          python -m unittest discover -s tests/planner -p "test_*.py"
          mkdocs build --strict
          python tests/planner/browser_checks.py

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean --remote-branch gh-pages