name: Daily Portal-Bicep Sync Check

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: Azure/bicep-ptn-aiml-landing-zone
  UPSTREAM_API: https://api.github.com/repos/Azure/bicep-ptn-aiml-landing-zone
  PORTAL_TEMPLATE: portal/template.json
  PORTAL_FORM: portal/form.json
  SYNC_LABEL: portal-sync
  UI_LABEL: ui-decision

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: portalbicepalignment

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$SYNC_LABEL" --description "Automated portal-bicep sync finding" --color "1d76db" --force 2>/dev/null || true
          gh label create "$UI_LABEL" --description "Requires UI/UX decision before implementation" --color "d93f0b" --force 2>/dev/null || true
          gh label create "auto-resolved" --description "Change can be applied without human input" --color "0e8a16" --force 2>/dev/null || true

      - name: Run sync check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/daily-sync.sh
