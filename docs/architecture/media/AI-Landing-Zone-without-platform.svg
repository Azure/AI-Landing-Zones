  <rect class="group" x="40" y="600" width="1520" height="260"/>
  <rect class="header" x="40" y="600" width="1520" height="60"/>
  <text class="heading" x="65" y="641">Optional channel recipes — configured separately, not deployed automatically</text>
  <text x="65" y="707">Teams / M365 → Bot Service → public Activity route → hosted agent</text>
  <text class="note" x="65" y="749">Microsoft source-IP filtering + authentication; Foundry public network access remains Disabled.</text>
  <text x="65" y="799">Copilot Studio → flow → dedicated Power Platform subnet → Foundry private endpoint</text>
  <text class="note" x="65" y="839">The flow uses its shared connection user's identity, not automatically the person chatting.</text>

  <text class="note" x="40" y="915">Hosted is default; a Container Apps worker is an alternative. Model Context Protocol (MCP) and custom ingestion are opt-in.</text>
  <text class="note" x="40" y="958">Simplified view: backing resources, identity grants, monitoring and egress controls are not all shown.</text>
