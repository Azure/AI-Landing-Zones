<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="986.5" viewBox="0 0 1600 986.5" role="img" aria-labelledby="title desc">
  <title id="title">Agent Landing Zone — standalone private reference layout</title>
  <desc id="desc">The signed-in user's web UI runs in Container Apps and calls the default Foundry hosted agent over HTTPS through a Foundry private endpoint. Application, network and Foundry resources have separate resource groups. Private networking is opt-in, not the template default. Optional Teams publication uses a source-IP-filtered authenticated public Activity exception; a Copilot Studio flow instead uses a dedicated Power Platform subnet and the Foundry private endpoint. Both channel integrations require separate setup.</desc>
