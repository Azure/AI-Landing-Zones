<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="conversation-title conversation-desc">
  <title id="conversation-title">Conversation state and private files</title>
  <desc id="conversation-desc">The authenticated Container Apps UI checks ownership before sending turns and optional validated inline files to one selected native host. Hosted uses Foundry persistence; Container Apps uses the official Durable Extension and Durable Task Scheduler. Optional UI Cosmos metadata stores owner mappings, titles, references, feedback and attachment descriptors. It stores no file bytes, transcripts, tokens or native checkpoints. Workflow mode or enabled history, feedback or attachments requires UI metadata. Conversational mode with all product flags off uses bounded volatile owner maps, lost on UI restart. Inline files do not use Blob, SAS or corporate ingestion; native host retention still applies.</desc>
