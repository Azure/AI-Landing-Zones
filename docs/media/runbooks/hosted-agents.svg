  <rect width="1000" height="780" fill="#fff"/>
  <text class="title" x="40" y="52">Choose one native execution host</text>
  <text x="40" y="88">Same authenticated UI; different clients and execution-state owners.</text>
  <rect class="group" x="40" y="170" width="240" height="450"/>
  <rect class="header" x="40" y="170" width="240" height="52"/>
  <text class="heading" x="60" y="204">Presentation</text>
  <rect class="node" x="60" y="295" width="200" height="160"/>
  <use href="#aca" x="135" y="315" width="50" height="50" aria-hidden="true"/>
  <text class="heading" x="160" y="398" text-anchor="middle">UI / BFF</text>
  <text class="label" x="160" y="432" text-anchor="middle">Owner checks</text>
  <text class="label" x="60" y="540">Product metadata</text>
  <text class="label" x="60" y="570">≠ execution state</text>
  <rect class="group" x="490" y="130" width="470" height="230"/>
  <rect class="header" x="490" y="130" width="470" height="52"/>
  <text class="heading" x="510" y="164">Option A · Foundry Hosted</text>
  <rect class="node" x="520" y="205" width="410" height="80"/>
  <use href="#agent" x="540" y="220" width="50" height="50" aria-hidden="true"/>
  <text x="610" y="253">Agent or workflow</text>
  <text x="520" y="330">Foundry owns execution state</text>
  <rect class="group" x="490" y="425" width="470" height="270"/>
  <rect class="header" x="490" y="425" width="470" height="52"/>
  <text class="heading" x="510" y="459">Option B · Container Apps + DTS</text>
  <rect class="node" x="520" y="500" width="410" height="80"/>
  <use href="#aca" x="540" y="515" width="50" height="50" aria-hidden="true"/>
  <text x="610" y="548">Native durable worker</text>
  <path class="flow" d="M725 580V620"/>
  <rect class="node" x="520" y="620" width="410" height="50"/>
  <text x="725" y="652" text-anchor="middle">DTS owns execution state</text>
  <path class="flow" d="M260 335H370V245H520"/>
  <text class="label" x="375" y="226">Responses</text>
  <path class="flow" d="M260 415H370V540H520"/>
  <text class="label" x="375" y="521">Durable client</text>
  <text class="heading" x="725" y="401" text-anchor="middle">OR</text>
  <text x="40" y="750">Deploy one host, not both. The UI metadata store is not a second checkpoint store.</text>
</svg>
