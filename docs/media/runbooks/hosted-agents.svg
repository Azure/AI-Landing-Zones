<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">Choose one native execution host</title>
  <desc id="desc">The authenticated UI uses either Foundry Hosted through its Responses client, or a Container Apps worker through its durable client. Foundry owns Hosted state. Durable Task Scheduler owns the worker's execution state. UI metadata is not a checkpoint store; the two hosts are alternatives.</desc>
