<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title description">
<title id="title">Fabric IQ: agent access through a knowledge base</title>
<desc id="description">Logical retrieval flow, not a credential-transport diagram. The agent calls a knowledge-base tool and the Search knowledge base calls either a published Fabric data agent or an ontology. Native Foundry connections and custom direct connectors have separate authorization contracts, described in the Fabric IQ guide, section 4. Source registration does not establish that user-authorization path in the reference app. The application team connects the tool. User-authorization implementation and acceptance checks remain in the guide, not in this architecture diagram. Fabric enforces user item and data permissions and applicable row-level security. The source corpus is not indexed locally.</desc>
