<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Which identity authorizes a Work IQ answer?</title>
  <desc id="desc">This is an integration recipe, not an installed native application path. A trusted application must carry a Work IQ app-audience user assertion separately from workload Search authentication. Search exchanges the assertion for delegated Work IQ access. Tenant billing, consent and federation are separate setup. No corpus copy or shared managed identity authorization is implied.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#32698e"/></marker>
    <marker id="setup-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#766798"/></marker>
    <!-- Intact Microsoft Azure public icons: https://learn.microsoft.com/azure/architecture/icons/ -->
