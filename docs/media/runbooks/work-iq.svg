<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="title description">
<title id="title">Work IQ: agent access through a knowledge base</title>
<desc id="description">Logical retrieval flow, not a credential-transport diagram. The agent calls a knowledge-base tool and the Search knowledge base retrieves Microsoft 365 context through its registered Work IQ source. Native Foundry connections and custom direct connectors have separate authorization contracts, described in the Work IQ guide, section 4. Source registration alone does not implement user authorization in the reference app. The application team connects the tool. User-authorization implementation and acceptance checks remain in the guide, not in this architecture diagram. Search and tenant administrators configure their own objects.</desc>
