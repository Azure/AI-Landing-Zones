<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Three choices compose the application</title>
  <desc id="desc">Before deployment, select the experience, one native host and optional capabilities independently. Dashed purple setup arrows combine these choices in the reviewed application image and configuration. This is not a request path or runtime strategy picker. A host choice does not enable tools.</desc>
