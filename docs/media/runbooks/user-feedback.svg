<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="feedback-title feedback-desc">
  <title id="feedback-title">Save feedback with its native reference</title>
  <desc id="feedback-desc">A signed-in user submits a rating and optional comment. The Container Apps UI checks admission, owner-bound UI session and current native reference. Hosted uses a response reference; DTS keeps a session execution reference across turns, not an immutable per-message reference. The UI validates native progress before writing feedback. Only the frontend receives the UI Cosmos metadata grant. Cosmos stores rating, comment, owner and execution references, not transcripts, file bytes, tokens or native checkpoints. A successful write is confirmed only after storage succeeds. ENABLE_USER_FEEDBACK defaults to false. Enable it before azd provision, then deploy; native state persistence alone does not enable feedback.</desc>
