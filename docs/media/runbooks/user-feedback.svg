  <rect width="1000" height="800" fill="white"/>
  <text class="title" x="30" y="52">Save a rating for the current agent result</text>
  <rect class="group" x="30" y="100" width="940" height="350"/>
  <rect class="header" x="30" y="100" width="940" height="48"/>
  <text class="heading" x="50" y="132">Authenticated feedback write</text>
  <rect class="node" x="50" y="180" width="210" height="240"/>
  <use href="#users" x="125" y="202" width="60" height="60" aria-hidden="true"/>
  <text class="node-title" x="155" y="299" text-anchor="middle">Signed-in user</text>
  <text x="155" y="338" text-anchor="middle">Rating: −1 or 1</text>
  <text x="155" y="365" text-anchor="middle">Optional comment</text>
  <text x="155" y="392" text-anchor="middle">Current result reference</text>
  <rect class="node" x="350" y="180" width="300" height="240"/>
  <use href="#aca" x="470" y="202" width="60" height="60" aria-hidden="true"/>
  <text class="node-title" x="500" y="299" text-anchor="middle">Chat UI + backend</text>
  <text x="500" y="338" text-anchor="middle">Admission + owner checks</text>
  <text x="500" y="365" text-anchor="middle">Native reference + progress check</text>
  <text x="500" y="392" text-anchor="middle">No caller-supplied owner grant</text>
  <path class="arrow" d="M260 290H350"/>
  <text x="305" y="272" text-anchor="middle">Submit</text>
  <rect class="node" x="740" y="180" width="210" height="240"/>
  <use href="#cosmos" x="815" y="202" width="60" height="60" aria-hidden="true"/>
  <text class="node-title" x="845" y="299" text-anchor="middle">UI Cosmos</text>
  <text x="845" y="338" text-anchor="middle">Rating + comment</text>
  <text x="845" y="365" text-anchor="middle">Owner + references</text>
  <text x="845" y="392" text-anchor="middle">Frontend-only grant</text>
  <path class="arrow" d="M650 290H740"/>
  <text x="695" y="272" text-anchor="middle">Write</text>
  <rect class="group" x="30" y="510" width="390" height="230"/>
  <rect class="header" x="30" y="510" width="390" height="48"/>
  <text class="heading" x="50" y="542">Native state stays with its host</text>
  <rect class="node" x="60" y="585" width="330" height="125"/>
  <text class="node-title" x="225" y="618" text-anchor="middle">Selected native execution</text>
  <text x="225" y="655" text-anchor="middle">Hosted: Foundry persistence</text>
  <text x="225" y="683" text-anchor="middle">Container Apps: durable state</text>
  <path class="arrow" d="M500 420V648H390"/>
  <rect x="440" y="470" width="190" height="60" fill="white"/>
  <text x="455" y="491">Validate current</text>
  <text x="455" y="518">native progress</text>
  <text class="heading" x="550" y="579">Confirm only after storage succeeds</text>
  <text x="550" y="617">Metadata is not a transcript or checkpoint.</text>
  <text x="550" y="644">No tokens or file bytes are saved here.</text>
  <text x="550" y="687">References identify the response or execution.</text>
  <text x="550" y="714">Each accepted submission is a new record.</text>
  <text x="30" y="778">Default: ENABLE_USER_FEEDBACK=false. Select true before azd provision, then azd deploy.</text>
</svg>
