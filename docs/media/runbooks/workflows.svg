<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Where does a human-reviewed run wait?</title>
  <desc id="desc">The reference process takes a topic, produces an agent draft and persists a pending human-review request in the selected native host. The owner submits approval or rejection through the authenticated UI. The workflow resumes and returns the original draft and decision. Neither outcome writes to a business system. Foundry Hosted and Container Apps with DTS are alternative hosts.</desc>
