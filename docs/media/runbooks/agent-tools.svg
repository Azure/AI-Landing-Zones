<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">What makes a capability callable?</title>
  <desc id="desc">The application registers optional capabilities for an agent or workflow on either native host. Search retrieval and Agent App MCP Server are two examples shown here. Search source access is independent of MCP transport and tool authorization. All capabilities start disabled. Configuration, permissions and network reachability are required in addition to registration. Other reviewed MCP servers have their own hosting contracts.</desc>
