  <rect width="1000" height="660" fill="#fff"/>
  <text class="title" x="40" y="52">What makes a capability callable?</text>
  <text x="40" y="88">Application registration is necessary; it is not a source or tool permission grant.</text>
  <rect class="group" x="40" y="150" width="290" height="410"/>
  <rect class="header" x="40" y="150" width="290" height="52"/>
  <text class="heading" x="60" y="184">Either native host</text>
  <rect class="node" x="60" y="275" width="250" height="165"/>
  <text class="heading" x="185" y="318" text-anchor="middle">Agent or workflow</text>
  <text x="185" y="363" text-anchor="middle">App registers</text>
  <text x="185" y="394" text-anchor="middle">selected capabilities</text>
  <text class="label" x="60" y="515">Optional flags default off</text>
  <rect class="group" x="580" y="150" width="380" height="410"/>
  <rect class="header" x="580" y="150" width="380" height="52"/>
  <text class="heading" x="600" y="184">Independent path examples</text>
  <rect class="node" x="610" y="230" width="320" height="130"/>
  <use href="#search" x="625" y="250" width="45" height="45" aria-hidden="true"/>
  <text class="heading" x="690" y="267">Search retrieval</text>
  <text x="690" y="301">Source capability</text>
  <text class="label" x="630" y="338">Source access still checked</text>
  <rect class="node" x="610" y="405" width="320" height="130"/>
  <use href="#aca" x="625" y="425" width="45" height="45" aria-hidden="true"/>
  <text class="heading" x="690" y="443">Agent App MCP</text>
  <text x="690" y="477">Server (optional)</text>
  <text class="label" x="630" y="513">Transport + tool authorization</text>
  <path class="flow" d="M310 315H440V295H610"/>
  <text class="label" x="450" y="274">Retrieval</text>
  <path class="flow" d="M310 400H440V470H610"/>
  <text class="label" x="450" y="450">MCP</text>
  <text x="40" y="609">A callable capability needs registration + configuration + permissions + network access.</text>
  <text class="label" x="40" y="643">Shown: Agent App MCP Server. Other MCP servers have their own hosting contracts.</text>
</svg>
