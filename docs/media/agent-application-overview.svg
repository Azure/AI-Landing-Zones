<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Agent Application overview</title>
  <desc id="overview-description">The reference application's Chainlit UI and backend for frontend run in Azure Container Apps. They support conversation, private file inputs and human workflow decisions. The orchestrator runs native Microsoft Agent Framework conversational agents, workflows or both, on one selected host: Microsoft Foundry Hosted Agents with the Responses integration, or Azure Container Apps with the Durable Extension and Durable Task Scheduler. The selected host owns native execution state. Conditional application Azure Cosmos DB storage contains UI ownership and action metadata, history and feedback, not native checkpoints. The orchestrator calls model deployments in Microsoft Foundry. Search and Foundry IQ are independent optional retrieval integrations. Optional Agent App MCP Server runs in a separate Container App using the official Python MCP SDK. It registers zero tools by default; only the explicitly selected NL2SQL toolset needs its approved metadata and vector catalog in application Cosmos, not Foundry backing Cosmos. An empty server still requires authentication and receives no NL2SQL model, catalog or secret grants. MCP does not require Search or ingestion. Agent App Ingestion is optional source processing and indexing, separate from private conversation attachments. The defaults are hosted and conversational, with optional features disabled. Other applications can replace the reference components through their own definition above the reusable foundation.</desc>
