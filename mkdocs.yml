site_name: AI Landing Zones
site_description: Documentation for AI Landing Zones
site_author: Microsoft
repo_url: https://github.com/Azure/AI-Landing-Zones
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: media/logo.svg
  favicon: media/logo.svg
  palette:
    scheme: default
  features:
    - content.icon
    - content.iconify
    - navigation.tracking
    - content.code.annotate
    - navigation.top
    # Remove:
    # - toc.integrate
plugins:
  - search
  - macros
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - sane_lists
  - mdx_truly_sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - What's New: whatisnew.md
  - FAQ: faq.md
  - AI Foundry Landing Zone:
      - "Design Checklist": ai-foundry-lz/design-checklist.md
      - Implementation:
        - Bicep:
          - "Overview": ai-foundry-lz/bicep/overview.md
          - "Deployed Resources & Cost": ai-foundry-lz/bicep/deployed-resources.md
          - "How to Deploy": ai-foundry-lz/bicep/how-to-deploy.md
          - "Deploy with Azure DevOps": ai-foundry-lz/bicep/deploy-with-azure-devops.md
          - "Regional Considerations": ai-foundry-lz/bicep/regional-considerations.md
          - "Hub-and-Spoke Topology": ai-foundry-lz/bicep/hub-and-spoke.md
          - "Public Ingress (App Gateway)": ai-foundry-lz/bicep/public-ingress.md
          - "Permissions": ai-foundry-lz/bicep/permissions.md
          - "Parameterization": ai-foundry-lz/bicep/parameterization.md
          - "Building Accelerators (Submodule Pattern)": ai-foundry-lz/bicep/accelerator-pattern.md
        - Terraform: ai-foundry-lz/terraform/readme.md
        - Portal: ai-foundry-lz/portal/readme.md
  - AI Gateway Landing Zone: ai-gateway-lz/bicep/readme.md
  - AI Container Landing Zone: ai-container-lz/readme.md



# These pages are intentionally kept out of the left navigation. The ACA
# design article is a standalone reference, and the bicep v2 migration page is
# a redirect stub that preserves an older URL. Listing them here keeps the nav
# clean and silences the "not in nav" check for just these files, while still
# flagging any future stray pages.
not_in_nav: |
  /AI-Landing-Zones-Design-ACA.md
  /bicep/migration-v2.md

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
