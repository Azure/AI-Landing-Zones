site_name: AI Landing Zones
site_description: Documentation for AI Landing Zones
site_author: Microsoft
repo_url: https://github.com/Azure/AI-Landing-Zones
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: media/logo.svg
  favicon: media/logo.svg
  palette:
    scheme: default
  features:
    - content.icon
    - content.iconify
    - navigation.tracking
    # - toc.integrate
    - content.code.annotate
    - navigation.top
plugins:
  - search
  - macros
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - sane_lists
  - mdx_truly_sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Agent Landing Zone:
      - "Overview": agent-landing-zone/index.md
      - "How the template works": agent-landing-zone/how-it-works.md
      - "Design Checklist": architecture/design-checklist.md
      - Plan your deployment:
          - "Resources and cost estimates": bicep/deployed-resources.md
          - "Cost planning": architecture/cost-guide.md
          - "Sizing and capacity": agent-landing-zone/sizing.md
      - Runbooks:
          - "Deploy infrastructure only": agent-landing-zone/deploy-infra-only.md
          - "Deploy the full stack": agent-landing-zone/deploy-full-stack.md
          - "Deploy with Azure DevOps": agent-landing-zone/azure-devops.md
      - Reference:
          - "Configuration": agent-landing-zone/configuration.md
          - "Agent hosting": agent-landing-zone/hosted-agents.md
          - "Network isolation": agent-landing-zone/network-isolation.md
          - "Custom applications": agent-landing-zone/build-your-own-app.md
          - "Terraform": terraform/index.md
          - "Portal": portal/Readme.md
      - "Troubleshooting": agent-landing-zone/troubleshooting.md
  - What's New: whatisnew.md
  - FAQ: architecture/faq.md

# Supporting references and compatibility pages remain reachable by link without
# competing with the two interactive deployment runbooks in the left navigation.
not_in_nav: |
  /AI-Landing-Zones-Design-ACA.md
  /terraform-parity.md
  /bicep/*.md
  /agent-landing-zone/customer-environments.md
  /agent-landing-zone/operations.md
  /agent-landing-zone/deploy-bicep.md
  /agent-landing-zone/deploy-terraform.md
  /agent-landing-zone/ingestion.md

extra:
  generator: false

extra_css:
  # Update the content version when styles change to invalidate browser caches.
  - stylesheets/extra.css?v=f9858cd57fe4
