site_name: AI Landing Zones
site_description: Documentation for AI Landing Zones
site_author: Microsoft
repo_url: https://github.com/Azure/AI-Landing-Zones
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: media/logo.svg
  favicon: media/logo.svg
  palette:
    scheme: default
  features:
    - content.icon
    - content.iconify
    - navigation.tracking
    - content.code.annotate
    - navigation.top
    # Remove:
    # - toc.integrate
plugins:
  - search
  - macros
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - sane_lists
  - mdx_truly_sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - What's New: whatisnew.md
  - FAQ: faq.md
  - AI Foundry Landing Zone:
      - "Design Checklist": ai-foundry-lz/design-checklist.md
      - Implementation:
        - Bicep:
          - "Overview": ai-foundry-lz/bicep/overview.md
          - "Deployed Resources & Cost": ai-foundry-lz/bicep/deployed-resources.md
          - "How to Deploy": ai-foundry-lz/bicep/how-to-deploy.md
          - "Deploy with Azure DevOps": ai-foundry-lz/bicep/deploy-with-azure-devops.md
          - "Regional Considerations": ai-foundry-lz/bicep/regional-considerations.md
          - "Hub-and-Spoke Topology": ai-foundry-lz/bicep/hub-and-spoke.md
          - "Public Ingress (App Gateway)": ai-foundry-lz/bicep/public-ingress.md
          - "Permissions": ai-foundry-lz/bicep/permissions.md
          - "Parameterization": ai-foundry-lz/bicep/parameterization.md
          - "Building Accelerators (Submodule Pattern)": ai-foundry-lz/bicep/accelerator-pattern.md
        - Terraform: ai-foundry-lz/terraform/readme.md
        - Portal: ai-foundry-lz/portal/readme.md
  - AI Gateway Landing Zone:
      - "What's New": ai-gateway-lz/bicep/citadel-v1-ga-announcement.md
      - "Overview": ai-gateway-lz/bicep/readme.md
      - "Benefits": ai-gateway-lz/bicep/governance-hub-benefits.md
      - "Plan": 
          - "Infrastructure": 
              - "Parameters": ai-gateway-lz/bicep/parameters-usage-guide.md
              - "Network Approach": ai-gateway-lz/bicep/network-approach.md
          - Capacity Planning:
              - "Citadel Sizing Guide": ai-gateway-lz/bicep/citadel-sizing-guide.md
              - "PTU Estimation Guide": ai-gateway-lz/bicep/ptu-estimation-guide.md
              - "AI Search Cost Estimation Logic": ai-gateway-lz/bicep/ai-search-cost-estimation-logic.md
          - Resilience/Business Continuouity:
              - "Resiliency Guide": ai-gateway-lz/bicep/resiliency-guide.md
              - "Business Continuity DR Guide": ai-gateway-lz/bicep/business-continuity-dr-guide.md
              - "Throttling Events Handling": ai-gateway-lz/bicep/throttling-events-handling.md
              - "App Insights Alert": ai-gateway-lz/bicep/app-insights-alert.md
              - "Cosmos Global Multi-Master Sync": ai-gateway-lz/bicep/cosmos-global-multi-master-sync.md
      - "Deploy":
          - Bicep:
              - "Quick Deployment Guide": ai-gateway-lz/bicep/quick-deployment-guide.md
              - "Full Deployment Guide": ai-gateway-lz/bicep/full-deployment-guide.md
              - "Post Deployment":
                  - "Post Deployment Guide": ai-gateway-lz/bicep/post-deployment-guide.md
                  - "Validation Notebook Setup Guide": ai-gateway-lz/bicep/validation-notebook-setup-guide.md
