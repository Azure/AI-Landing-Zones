site_name: AI Landing Zones
site_description: Documentation for AI Landing Zones
site_author: Microsoft
repo_url: https://github.com/Azure/AI-Landing-Zones
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: media/logo.svg
  favicon: media/logo.svg
  palette:
    scheme: default
  features:
    - content.icon
    - content.iconify
    - navigation.tracking
    # - toc.integrate
    - content.code.annotate
    - navigation.top
plugins:
  - search
  - macros
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - sane_lists
  - mdx_truly_sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
