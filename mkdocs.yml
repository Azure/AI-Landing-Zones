      - Operate:
          - Observe:
              - "Platform Observability Guide": ai-gateway-lz/bicep/platform-observability-guide.md
              - "Power BI Dashboard": ai-gateway-lz/bicep/power-bi-dashboard.md
          - Backend Contracts:
              - Bicep:
                  - "LLM Backend Onboarding": ai-gateway-lz/bicep/llm-backend-onboarding.md
                  - "Unified AI API Type Onboarding": ai-gateway-lz/bicep/unified-ai-api-type-onboarding.md
              - Terraform:
                  - "LLM Backend Onboarding": ai-gateway-lz/terraform/llm-backend-onboarding.md
          - Access Contracts:
