<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="access-title access-desc">
  <title id="access-title">Sign in, invoke, then authorize documents</title>
  <desc id="access-desc">A user signs in with Microsoft Entra ID. The Container Apps UI checks admission and session ownership, then exchanges the user token for Foundry invocation. Protected retrieval needs a separate source-specific authorization integration. The native UI client does not automatically forward a Search user token. Login, a known session ID and workload roles do not grant document access. OBO means on-behalf-of token exchange; RBAC means role-based access control.</desc>
