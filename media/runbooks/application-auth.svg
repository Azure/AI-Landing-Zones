  <rect width="1000" height="960" fill="white"/>
  <text class="title" x="30" y="52">Sign in, invoke, then authorize documents</text>
  <rect class="group" x="30" y="100" width="640" height="340"/>
  <rect class="header" x="30" y="100" width="640" height="48"/>
  <text class="heading" x="50" y="132">Authenticated application</text>
  <rect class="group" x="700" y="100" width="270" height="340"/>
  <rect class="header" x="700" y="100" width="270" height="48"/>
  <text class="heading" x="720" y="132">Microsoft Foundry</text>
  <rect class="node" x="50" y="180" width="210" height="210"/>
  <use href="#users" x="125" y="202" width="60" height="60" aria-hidden="true"/>
  <text class="node-title" x="155" y="298" text-anchor="middle">Signed-in user</text>
  <text x="155" y="334" text-anchor="middle">Microsoft Entra ID</text>
  <text x="155" y="360" text-anchor="middle">UI API access token</text>
  <rect class="node" x="350" y="180" width="300" height="210"/>
  <use href="#aca" x="470" y="202" width="60" height="60" aria-hidden="true"/>
  <text class="node-title" x="500" y="298" text-anchor="middle">Chat UI + backend</text>
  <text x="500" y="334" text-anchor="middle">Container Apps</text>
  <text x="500" y="360" text-anchor="middle">Admission + owner checks</text>
  <path class="arrow" d="M260 285H350"/>
  <text x="305" y="267" text-anchor="middle">Token</text>
  <rect class="node" x="720" y="180" width="230" height="210"/>
  <use href="#foundry" x="805" y="202" width="60" height="60" aria-hidden="true"/>
  <text class="node-title" x="835" y="298" text-anchor="middle">Hosted agent</text>
  <text x="835" y="334" text-anchor="middle">Delegated invocation</text>
  <text x="835" y="360" text-anchor="middle">Caller RBAC required</text>
  <path class="arrow" d="M650 285H720"/>
  <text x="685" y="267" text-anchor="middle">OBO</text>
  <path class="arrow integration" d="M835 390V600"/>
  <rect x="718" y="470" width="234" height="58" fill="white"/>
  <text x="835" y="490" text-anchor="middle">Separate integration required</text>
  <text x="835" y="516" text-anchor="middle">Workload + user permissions</text>
  <rect class="group" x="700" y="552" width="270" height="208"/>
  <rect class="header" x="700" y="552" width="270" height="48"/>
  <text class="heading" x="720" y="584">Protected retrieval</text>
  <rect class="node" x="710" y="620" width="250" height="120"/>
  <use href="#search" x="728" y="640" width="48" height="48" aria-hidden="true"/>
  <text class="node-title" x="788" y="656">Azure AI Search</text>
  <text x="788" y="686">Current document</text>
  <text x="788" y="712">permissions</text>
  <path class="arrow integration" d="M835 600V620"/>
  <text class="heading" x="50" y="498">Separate credentials, separate grants</text>
  <text x="50" y="536">The UI exchanges the user token for Foundry access.</text>
  <text x="50" y="563">Retrieval needs its own configured authorization path.</text>
  <text x="50" y="611">Entra administrator: delegated permissions and consent.</text>
  <text x="50" y="638">RBAC administrator: Foundry caller access.</text>
  <text x="50" y="665">Data owner: source roles and document permissions.</text>
  <text x="50" y="723" font-weight="600">Login or workload RBAC alone is not document access.</text>
  <text x="30" y="798">Solid arrows show the Hosted invocation path supplied by the application.</text>
  <text x="30" y="830">Dashed arrows show retrieval integration that you must configure and test.</text>
  <text x="30" y="862">OBO = on-behalf-of token exchange.</text>
  <text x="30" y="894">RBAC = role-based access control.</text>
  <text x="30" y="926">Private endpoints require permitted network access.</text>
</svg>
