      .node-title { font-size: 22px; font-weight: 600; }
      .group { fill: #f3f8fc; stroke: #9bb2c4; stroke-width: 1.5; }
      .header { fill: #e1edf4; stroke: #9bb2c4; stroke-width: 1.5; }
      .node { fill: white; stroke: #9bb2c4; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #32698e; stroke-width: 2; marker-end: url(#arrow); }
      .integration { stroke-dasharray: 7 5; }
    </style>
