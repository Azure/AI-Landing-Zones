<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Who indexes SharePoint content and refreshes its permissions?</title>
  <desc id="desc">Two alternative indexed paths. Native indexedSharePoint lets Search ingest content and permissions into a generated index using a federated ingestion app. Optional Agent App Ingestion uses Graph selected-site app access and scheduled ACL refresh to write an application-owned index, optionally registered as a searchIndex source. Both need separate user-authorized retrieval integration. App-only source read access does not authorize users. Remote SharePoint is a separate non-copying service option, not shown as a shipped application switch.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#32698e"/></marker>
    <!-- Intact Microsoft Azure public icon: https://learn.microsoft.com/azure/architecture/icons/ -->
    <g id="search-icon"><svg id="f470e112-f1d8-4c18-a381-9b54e11a9ca3" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><defs><linearGradient id="b198f9ad-224e-4f37-99bb-f1c5a20d3916" x1="9" y1="0.36" x2="9" y2="18.31" gradientUnits="userSpaceOnUse"><stop offset="0.18" stop-color="#5ea0ef" /><stop offset="1" stop-color="#0078d4" /></linearGradient></defs><title>Icon-web-44</title><path d="M18,11.32a4.12,4.12,0,0,0-3.51-4,5.15,5.15,0,0,0-5.25-5,5.25,5.25,0,0,0-5,3.49A4.86,4.86,0,0,0,0,10.59a5,5,0,0,0,5.07,4.82l.44,0h8.21a.78.78,0,0,0,.22,0A4.13,4.13,0,0,0,18,11.32Z" fill="url(#b198f9ad-224e-4f37-99bb-f1c5a20d3916)" /><path d="M12.33,6.59a3.07,3.07,0,0,0-5.61.85,3.16,3.16,0,0,0,.33,2.27L4.71,12.08a.79.79,0,0,0,0,1.12.78.78,0,0,0,.56.23.76.76,0,0,0,.56-.23l2.33-2.36a3.14,3.14,0,0,0,.81.33,3.08,3.08,0,0,0,3.36-4.58Zm-.54,2.1A2.16,2.16,0,0,1,9.7,10.34a1.79,1.79,0,0,1-.51-.07,1.87,1.87,0,0,1-.7-.32,2.13,2.13,0,0,1-.56-.56,2.17,2.17,0,0,1-.31-1.73A2.14,2.14,0,0,1,9.7,6a2.31,2.31,0,0,1,.52.06,2.18,2.18,0,0,1,1.32,1A2.13,2.13,0,0,1,11.79,8.69Z" fill="#f2f2f2" /><ellipse cx="9.69" cy="8.18" rx="2.15" ry="2.16" fill="#83b9f9" /></svg></g>
  </defs>
  <style>text{font-family:"Segoe UI",sans-serif;fill:#1e3646;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:600}.node{fill:#fff;stroke:#9bb2c4;stroke-width:1.5}.group{fill:#f3f8fc;stroke:#9bb2c4;stroke-width:1.5}.header{fill:#e1edf4;stroke:#9bb2c4;stroke-width:1.5}.flow{fill:none;stroke:#32698e;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1000" height="760" fill="#fff"/>
  <text x="32" y="46" class="title">Who indexes SharePoint content and refreshes its permissions?</text>
  <text x="32" y="80">Choose an indexing owner — source read access is not end-user document authorization</text>
  <rect x="32" y="118" width="936" height="208" class="group"/>
  <rect x="32" y="118" width="936" height="44" class="header"/>
  <text x="50" y="147" class="head">A. Native indexedSharePoint — shipped source-registration template</text>
  <rect x="52" y="182" width="230" height="120" class="node"/>
  <text x="72" y="220" class="head">SharePoint site</text>
  <text x="72" y="254">Federated app</text>
  <rect x="386" y="182" width="236" height="120" class="node"/>
  <use href="#search-icon" transform="translate(402 195) scale(2)"/>
  <text x="452" y="220" class="head">Search indexer</text>
  <text x="406" y="262">Content + permissions</text>
  <rect x="726" y="182" width="222" height="120" class="node"/>
  <use href="#search-icon" transform="translate(744 195) scale(2)"/>
  <text x="792" y="220" class="head">Managed</text>
  <text x="746" y="254">Generated index</text>
  <text x="746" y="284">Search owns refresh</text>
  <path d="M282 242H386" class="flow"/>
  <text x="295" y="221">Copy</text>
  <path d="M622 242H726" class="flow"/>
  <text x="632" y="221">Index</text>
  <rect x="32" y="360" width="936" height="242" class="group"/>
  <rect x="32" y="360" width="936" height="44" class="header"/>
  <text x="50" y="389" class="head">B. Application-managed — optional Agent App Ingestion + operator configuration</text>
  <rect x="52" y="426" width="230" height="150" class="node"/>
  <text x="72" y="464" class="head">Lists / libraries</text>
  <text x="72" y="499">Graph app access</text>
  <text x="72" y="530">Sites.Selected</text>
  <text x="72" y="559">+ selected-site grant</text>
  <rect x="386" y="426" width="236" height="150" class="node"/>
  <text x="406" y="464" class="head">Ingestion worker</text>
  <text x="406" y="503">Content + ACLs</text>
  <text x="406" y="536">Scheduled ACL refresh</text>
  <rect x="726" y="426" width="222" height="150" class="node"/>
  <use href="#search-icon" transform="translate(744 439) scale(2)"/>
  <text x="792" y="464" class="head">Owned index</text>
  <text x="746" y="503">Optional searchIndex</text>
  <text x="746" y="536">knowledge source</text>
  <path d="M282 501H386" class="flow"/>
  <text x="295" y="480">Read</text>
  <path d="M622 501H726" class="flow"/>
  <text x="632" y="480">Write</text>
  <text x="32" y="644" class="head">Both routes: connect retrieval separately and prove allowed / denied-user results.</text>
  <text x="32" y="681">Native MCP connection or explicit connector integration; app-only ingestion grants are not user grants.</text>
  <text x="32" y="723">Remote SharePoint: separate no-copy service option; native application integration is still required.</text>
</svg>
