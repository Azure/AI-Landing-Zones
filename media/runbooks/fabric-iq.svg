  <style>text{font-family:"Segoe UI",sans-serif;fill:#1e3646;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:600}.node{fill:#fff;stroke:#9bb2c4;stroke-width:1.5}.group{fill:#f3f8fc;stroke:#9bb2c4;stroke-width:1.5}.header{fill:#e1edf4;stroke:#9bb2c4;stroke-width:1.5}.flow{fill:none;stroke:#32698e;stroke-width:2;marker-end:url(#arrow)}.setup{fill:none;stroke:#766798;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#setup-arrow)}</style>
  <rect width="1000" height="790" fill="#fff"/>
  <text x="32" y="46" class="title">Who answers a Fabric analytical question?</text>
  <text x="32" y="80">Source templates are shipped; application delegation is an explicit integration task</text>
  <rect x="32" y="184" width="238" height="202" class="node"/>
  <text x="52" y="220" class="head">Application</text>
  <text x="52" y="247" class="head">integration</text>
  <text x="52" y="286">Native tool connection</text>
  <text x="52" y="316">or custom connector</text>
  <text x="52" y="346">Prove user delegation</text>
  <rect x="366" y="136" width="242" height="300" class="group"/>
  <rect x="366" y="136" width="242" height="44" class="header"/>
  <text x="384" y="165" class="head">Azure AI Search</text>
  <rect x="382" y="200" width="210" height="214" class="node"/>
  <use href="#search-icon" transform="translate(462 220) scale(2.6)"/>
  <text x="402" y="303" class="head">Knowledge base</text>
  <text x="402" y="342">Bound Fabric source</text>
  <text x="402" y="378">Preview integration</text>
  <rect x="704" y="118" width="264" height="338" class="group"/>
  <rect x="704" y="118" width="264" height="44" class="header"/>
  <text x="722" y="147" class="head">Fabric: choose a source</text>
  <rect x="720" y="184" width="232" height="108" class="node"/>
  <text x="740" y="219" class="head">Data agent</text>
  <text x="740" y="252">Analytical answers</text>
  <text x="740" y="280">Published + shared</text>
  <rect x="720" y="324" width="232" height="108" class="node"/>
  <text x="740" y="359" class="head">Ontology</text>
  <text x="740" y="392">Business relationships</text>
  <text x="815" y="316">OR</text>
  <path d="M270 286H382" class="flow"/>
  <text x="282" y="242">Authorized</text>
  <text x="282" y="268">retrieve</text>
  <path d="M592 286H657V238H720" class="flow"/>
  <path d="M657 286V378H720" class="flow"/>
  <text x="624" y="205">Query</text>
  <text x="32" y="498">Fabric enforces item + underlying data permissions and applicable row-level security.</text>
  <text x="32" y="532">Direct connector recipe: delegated Search token; workload token authenticates transport only.</text>
  <path d="M32 556H968" stroke="#9bb2c4" stroke-dasharray="4 4"/>
  <rect x="32" y="582" width="280" height="90" class="node"/>
  <text x="52" y="617" class="head">Fabric + Search owners</text>
  <text x="52" y="648">Publish, share, bind source</text>
  <text x="550" y="613">No landing-zone corpus copy.</text>
  <text x="550" y="645">App-managed SQL tools are a separate route.</text>
  <text x="32" y="704">Blue arrows show the retrieval request path.</text>
  <text x="32" y="736">The application owner must connect the application to Search and test user delegation.</text>
  <text x="32" y="768">Before application testing: publish the Fabric source, bind it to Search, and grant user access.</text>
