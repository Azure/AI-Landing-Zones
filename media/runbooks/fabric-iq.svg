<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
  <title id="title">Who answers a Fabric analytical question?</title>
  <desc id="desc">An application integration queries a Search knowledge base with source-compatible delegated user authorization. Choose a published Fabric data agent or an ontology using its workspace and item IDs. Fabric owns analytical execution and underlying data permissions, including applicable row-level security. Source templates are shipped. Source registration does not connect the application. The application owner must connect the application to Search and test user delegation. MCP NL2SQL is a separate SQL route.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#32698e"/></marker>
    <marker id="setup-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#766798"/></marker>
    <!-- Intact Microsoft Azure public icon: https://learn.microsoft.com/azure/architecture/icons/ -->
