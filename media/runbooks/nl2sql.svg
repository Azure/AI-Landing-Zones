  <rect width="1000" height="850" fill="#fff"/>
  <text x="32" y="46" class="title">Where is SQL generated and authorized?</text>
  <text x="32" y="80">Natural language to SQL — optional tools; the server exposes none by default</text>
  <rect x="32" y="194" width="220" height="182" class="node"/>
  <text x="52" y="236" class="head">Agent / Workflow</text>
  <text x="52" y="279">Authorized caller</text>
  <text x="52" y="312">Source ID + question</text>
  <text x="52" y="345">Receives typed rows</text>
  <rect x="346" y="118" width="330" height="300" class="group"/>
  <rect x="346" y="118" width="330" height="44" class="header"/>
  <text x="364" y="147" class="head">Agent App MCP Server</text>
  <rect x="362" y="184" width="298" height="212" class="node"/>
  <text x="382" y="221" class="head">Selected toolset: nl2sql</text>
  <text x="382" y="258">list_sources() · query()</text>
  <text x="382" y="298">Embed + retrieve metadata</text>
  <text x="382" y="334">Generate with selected model</text>
  <text x="382" y="370">Validate read-only SQL</text>
  <rect x="770" y="194" width="198" height="222" class="node"/>
  <use href="#sql-icon" transform="translate(842 214) scale(2.6)"/>
  <text x="790" y="303" class="head">Approved SQL</text>
  <text x="790" y="339">Azure SQL /</text>
  <text x="790" y="370">SQL Server</text>
  <text x="790" y="401">Read-only principal</text>
  <path d="M252 282H362" class="flow"/>
  <text x="274" y="258">MCP</text>
  <path d="M660 282H770" class="flow"/>
  <text x="686" y="242">Validated</text>
  <text x="686" y="268">SELECT</text>
  <rect x="346" y="494" width="330" height="150" class="node"/>
  <use href="#cosmos-icon" transform="translate(366 510) scale(2.5)"/>
  <text x="427" y="539" class="head">App Cosmos catalog</text>
  <text x="366" y="582">Approved sources · active version</text>
  <text x="366" y="617">Schema / example embeddings</text>
  <path d="M511 396V494" class="flow"/>
  <text x="534" y="459">Catalog read</text>
  <rect x="32" y="494" width="220" height="150" class="node"/>
  <text x="52" y="534" class="head">Separate importer</text>
  <text x="52" y="574">Managed identity</text>
  <text x="52" y="609">Embeds + activates</text>
  <path d="M252 568H346" class="setup"/>
  <text x="267" y="546">Import</text>
  <text x="720" y="525" class="head">Separate grant owners</text>
  <text x="720" y="563">Platform: catalog + models</text>
  <text x="720" y="598">SQL owner: database read</text>
  <text x="32" y="692">Admitted users share the approved SQL dataset; no per-user database delegation.</text>
  <text x="32" y="729">Blue arrows show tool calls, catalog reads and SQL execution.</text>
  <text x="32" y="761">Purple dashed arrows show catalog import, not user requests.</text>
  <text x="32" y="793">MCP = Model Context Protocol.</text>
  <text x="32" y="825">This route does not use Azure AI Search.</text>
