<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">Where is SQL generated and authorized?</title>
  <desc id="desc">The Agent or Workflow invokes Agent App MCP Server. Inside that server, the explicitly selected nl2sql toolset lists approved sources and queries by source ID and question. It reads its own source and vector metadata catalog in Cosmos, embeds and generates with selected models, validates SQL, then executes against an approved read-only database. A separate managed-identity importer activates catalog versions. The default server has zero tools. Search and per-user SQL delegation are not part of this route.</desc>
