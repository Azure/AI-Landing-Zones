  <style>text{font-family:"Segoe UI",sans-serif;fill:#1e3646;font-size:20px} .title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:600}.node{fill:#fff;stroke:#9bb2c4;stroke-width:1.5}.group{fill:#f3f8fc;stroke:#9bb2c4;stroke-width:1.5}.header{fill:#e1edf4;stroke:#9bb2c4;stroke-width:1.5}.flow{fill:none;stroke:#32698e;stroke-width:2;marker-end:url(#arrow)}.setup{fill:none;stroke:#766798;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#setup-arrow)}</style>
  <rect width="1000" height="730" fill="#fff"/>
  <text x="32" y="46" class="title">What connects an Agent to a Foundry IQ knowledge base?</text>
  <text x="32" y="80">Source provisioning ≠ native tool connection ≠ user authorization</text>
  <rect x="32" y="116" width="260" height="188" class="group"/>
  <rect x="32" y="116" width="260" height="44" class="header"/>
  <text x="50" y="145" class="head">Native application</text>
  <rect x="48" y="176" width="228" height="110" class="node"/>
  <use href="#agent-icon" transform="translate(62 195) scale(2)"/>
  <text x="112" y="206" class="head">Agent /</text>
  <text x="112" y="233" class="head">Workflow</text>
  <text x="62" y="267">Foundry IQ flag on</text>
  <rect x="370" y="176" width="262" height="110" class="node"/>
  <text x="390" y="207" class="head">Project tool connection</text>
  <text x="390" y="238">RemoteTool contract</text>
  <text x="390" y="267">Operator must connect</text>
  <path d="M276 226H370" class="flow"/>
  <text x="298" y="203">Tool call</text>
  <rect x="710" y="116" width="258" height="188" class="group"/>
  <rect x="710" y="116" width="258" height="44" class="header"/>
  <text x="728" y="145" class="head">Azure AI Search</text>
  <rect x="726" y="176" width="226" height="110" class="node"/>
  <use href="#search-icon" transform="translate(744 188) scale(2.4)"/>
  <text x="799" y="207" class="head">Knowledge</text>
  <text x="799" y="234" class="head">base</text>
  <text x="744" y="270">Bound sources</text>
  <path d="M632 226H726" class="flow"/>
  <text x="641" y="203">Retrieve</text>
  <path d="M839 304V341H265V382" class="flow"/>
  <path d="M839 341V382" class="flow"/>
  <rect x="32" y="382" width="466" height="137" class="node"/>
  <text x="52" y="415" class="head">Native Blob source (default)</text>
  <text x="52" y="449">Search manages ingestion + generated index</text>
  <text x="52" y="482">Default permissions: storage access scopes</text>
  <rect x="546" y="382" width="422" height="137" class="node"/>
  <text x="566" y="415" class="head">Existing index source (alternative)</text>
  <text x="566" y="449">Owner supplies content + permissions</text>
  <text x="566" y="482">Registration does not ingest content</text>
  <text x="32" y="365">Source lookups</text>
  <path d="M32 550H968" stroke="#9bb2c4" stroke-dasharray="4 4"/>
  <rect x="32" y="580" width="260" height="90" class="node"/>
  <use href="#user-icon" transform="translate(50 605) scale(2)"/>
  <text x="103" y="615" class="head">App owner</text>
  <text x="103" y="646">Connection setup</text>
  <path d="M292 625H315V537H522V320H501V286" class="setup"/>
  <text x="350" y="584" class="head">Foundry Search and Foundry IQ use distinct connections.</text>
  <text x="350" y="614">Generated CognitiveSearch ≠ required RemoteTool contract.</text>
  <text x="350" y="644">Bind the tool, redeploy; prove allowed / denied-user access.</text>
  <text x="32" y="709">MCP = Model Context Protocol. Blue: retrieval calls. Purple dashed: setup only.</text>
</svg>
