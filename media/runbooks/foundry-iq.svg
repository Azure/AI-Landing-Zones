<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc">
  <title id="title">What connects an Agent to a Foundry IQ knowledge base?</title>
  <desc id="desc">The native Agent or Workflow registers a Model Context Protocol (MCP) project-connection tool for Foundry IQ, separately from the native Foundry Search connection. Provisioning supplies a dedicated CognitiveSearch connection ID for the knowledge base; the documented native tool requires a compatible RemoteTool connection. The application owner must configure that binding and verify source-specific user authorization. Search owns the knowledge base and either native Blob ingestion or a registered existing index. Purple dashed arrows show setup, not runtime traffic.</desc>
