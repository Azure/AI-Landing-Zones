<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="title desc">
  <title id="title">Tools available to the agent</title>
  <desc id="desc">The Agent Application explicitly supplies tools to its agent or workflow on one selected host. Foundry tool integrations include Azure AI Search for a configured index and Foundry IQ through its own prepared project connection. Application tool integrations include the multimodal_retrieve function and tool functions discovered from an MCP server. The explicitly selected NL2SQL toolset on Agent App MCP Server provides nl2sql.list_sources and nl2sql.query. The four branches are independent optional integrations, not a required sequence. Each needs its own configuration and authorization.</desc>
