  <text class="title" x="40" y="52">Tools available to the agent</text>
  <text x="40" y="88">The application supplies the agent's tool list explicitly.</text>
  <rect class="group" x="40" y="150" width="270" height="710"/>
  <rect class="header" x="40" y="150" width="270" height="52"/>
  <text class="heading" x="60" y="184">Agent Application</text>
  <text x="60" y="253">Select one host:</text>
  <text x="60" y="285">Foundry Hosted</text>
  <text class="label" x="60" y="315">or Container Apps + DTS</text>
