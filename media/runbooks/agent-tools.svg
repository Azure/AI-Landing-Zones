  <text class="heading" x="175" y="490" text-anchor="middle">Agent or workflow</text>
  <text x="175" y="535" text-anchor="middle">Configured tools</text>
  <text class="label" x="175" y="567" text-anchor="middle">available to the model</text>
  <text class="label" x="60" y="748">Optional tools start off.</text>
  <text class="label" x="60" y="780">Enable what you need.</text>
