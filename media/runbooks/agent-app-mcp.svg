<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">Server compute is not tool selection</title>
  <desc id="desc">An agent or workflow on either native host invokes Agent App MCP Server in a separate Container App over authenticated HTTPS MCP. The default empty selection registers zero tools and no SQL clients. Alternatively, selecting nl2sql registers two SQL tools and initializes catalog, model and read-only SQL dependencies. Both choices require Entra authentication, an allowed client and the MCP.Invoke role. Toolset changes require matching provisioning and restart or redeployment.</desc>
